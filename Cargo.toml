[package]
name = "window-cap"
version = "0.3.0"
edition = "2024"
description = "Windows screenshot and annotation tool (flameshot-like)"
license = "MIT"
build = "build.rs"

[dependencies]
image = { version = "0.25.10", default-features = false, features = ["png"] }
log = "0.4.34"
thiserror = "2.0.21"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_GdiPlus", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Input_Ime", "Win32_UI_HiDpi", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_System_Memory", "Win32_System_DataExchange", "Win32_System_ProcessStatus", "Win32_Graphics_Dwm"] }

[build-dependencies]
winresource = "0.1.34"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
